<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="/fenice-favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/fenice-favicon-64.png">
<link rel="apple-touch-icon" sizes="128x128" href="/fenice-favicon-128.png">
<title>404 — Pagina non trovata | Fenice</title>
<style>
  :root {
    --bg: #faf8f4;
    --primary: #0c4a6e;
    --accent: #b8956a;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e0dbd3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 24px;
    text-align: center;
  }
  .logo-wrap {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    margin-bottom: 48px;
  }
  .logo-img { width: 40px; height: 40px; }
  .logo-divider { width: 1px; height: 28px; background: var(--border); }
  .logo-text { text-align: left; }
  .logo-name { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; color: var(--primary); line-height: 1; }
  .logo-sub { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); line-height: 1; margin-top: 4px; }
  .code {
    font-family: Georgia, serif;
    font-size: clamp(80px, 18vw, 140px);
    font-weight: 700;
    color: var(--primary);
    opacity: 0.12;
    line-height: 1;
    user-select: none;
    margin-bottom: -20px;
  }
  h1 {
    font-family: Georgia, serif;
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 12px;
  }
  p {
    font-size: 1rem;
    color: var(--muted);
    max-width: 36ch;
    line-height: 1.7;
    margin-bottom: 36px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 12px;
    transition: background 0.2s, transform 0.15s;
  }
  .btn:hover { background: #083555; transform: translateY(-1px); }
  .btn svg { flex-shrink: 0; }
  .footer-note {
    margin-top: 56px;
    font-size: 0.78rem;
    color: var(--border);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <a href="/" class="logo-wrap">
    <img src="/fenice-logo.png" alt="Fenice" class="logo-img">
    <div class="logo-divider"></div>
    <div class="logo-text">
      <div class="logo-name">Fenice</div>
      <div class="logo-sub">Digital Agency</div>
    </div>
  </a>

  <div class="code">404</div>

  <h1>Pagina non trovata</h1>
  <p>La pagina che stai cercando non esiste o è stata spostata. Torna alla home per continuare.</p>

  <a href="/" class="btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>
    Torna alla Home
  </a>

  <div class="footer-note">© 2026 Fenice.Digital</div>
</body>
</html>
